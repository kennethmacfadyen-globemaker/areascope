name: Refresh city data

on:
  schedule:
    - cron: "17 6 3 * *"   # 06:17 UTC on the 3rd of every month (police data updates monthly)
  workflow_dispatch: {}     # allow manual runs from the Actions tab

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Rebuild city pages from live data
        run: node scripts/build-cities.mjs
      - name: Commit and push if changed
        run: |
          git config user.name "areascope-bot"
          git config user.email "actions@github.com"
          git add cities sitemap.xml
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "chore: monthly data refresh ($(date -u +%Y-%m))"
          git push
